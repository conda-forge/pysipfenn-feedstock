schema_version: 1

context:
  name: pysipfenn
  version: "0.18.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pysipfenn-${{ version }}.tar.gz
  sha256: 9ef9e409d87098cb818e8e3905b4cddbdd6661d98c9e5b362cf4778727e5b9d1

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - setuptools-scm
    - pip
  run:
    - plotly >=5.15.0
    - colorama
    - pysmartdl2 >=2.0.0
    - ruamel.yaml
    - spglib >=2.5.0
    - python >=${{ python_min }}
    - pymatgen >=2024.2.20
    - pytorch >=2.7.0
    - onnx2torch >=1.5.2
    - onnx >=1.13.0
    - numpy >=2.0.0
    - tqdm >=4.65.0
    - natsort >=8.3.0
    - pymongo >=4.4
    - pysmartdl >=1.3.4
    - dnspython

tests:
  - python:
      imports:
        - pysipfenn
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Easily extensible Python package for featurizing periodic atomic structures and running Structure-Informed Prediction of Formation Energy using Neural Networks (SIPFENN)
  license: LGPL-3.0-only
  license_file: LICENSE.md
  homepage: https://phaseslab.com/sipfenn
  repository: https://github.com/PhasesResearchLab/pySIPFENN

extra:
  recipe-maintainers:
    - amkrajewski
    - jan-janssen
